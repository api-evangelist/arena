aid: arena
name: Arena
description: >-
  Arena is an AI-powered audience engagement platform that lets publishers,
  media companies, and brands build first-party communities directly on their
  own websites and apps. Its products include Live Chat, Live Blog, Comments,
  Polls, and Q&A, plus moderation, analytics, and monetization tooling designed
  to increase traffic, boost engagement, generate leads, and monetize audiences.
  Developers integrate through the Arena Platform API (V3) and official
  JavaScript, Android, and iOS SDKs, authenticating with a site API key or a JWT
  that also powers Single Sign-On for Live Chat and Live Blog. Arena is a
  developer-tools / audience-engagement company backed by CRV, Felicis,
  Lightspeed Venture Partners, and Techstars.
